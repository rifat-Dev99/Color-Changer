<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color changer Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter app project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main">
            <div class="head">
                <h1>Color Changer</h1>
                <p>Chilk the button to change the background color</p>
            </div>
            <div class="color">
                <h3 class="h3">#4361EE</h3>
                <p class="colorPera">Current Color</p>
            </div>
            <div class="choose">
                <p class="choosePera">Choose a Color</p>
                <div class="chooseColor">
                    <div class="round blue"></div>
                    <div class="round red"></div>
                    <div class="round green"></div>
                    <div class="round yellow"></div>
                    <div class="round purple"></div>
                    <div class="round pink"></div>
                </div>
            </div>
            <div class="or">
                <hr>OR<hr>
            </div>
            <div class="random">
                <img src="random.svg" alt="random">
                <div class="randomText">Random Color</div>
            </div>
            <div class="copy">
                <div class="box1">
                    <img src="copy1.svg" alt="">
                    <div class="code">
                        <p>Color Code</p>
                        <div id="colorCode" class="hastag">#4361EE</div>
                    </div>
                </div>
                <div class="box2 ">
                    <img width="25"  src="copy-svgrepo-com.svg" alt="">
                    <div class="copyBtn">Copy</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
</body>
</html>
